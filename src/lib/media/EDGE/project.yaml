title: Environmental Diplomacy and Geopolitics (EDGE)
description: >-
  EDGE is a European twinning project dedicated to the interrelation between environmental and (geo)political questions.
  As environment takes on growing importance in geopolitical questions, the EDGE project promotes knowledge transfer in
  terms of environment and public policies and supports cooperation between universities with complementary skills. The
  project aims to support student exchanges between three universities (Bratislava University of Economics, Sciences Po
  and University of Liège) to enable them to increase their knowledge in environmental and geopolitical diplomacy. The
  EDGE program includes also a Summer School to stimulate scientific exchange and promote the program works.
link: https://medialab.sciencespo.fr/en/activities/environmental-diplomacy-and-geopolitics-edge/
