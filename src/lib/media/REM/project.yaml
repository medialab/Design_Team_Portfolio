title: Reset Modernity!
description: >-
  What do you do when you are disoriented, when the compass of your phone goes haywire? You reset it. The procedure
  depends on the situation and device, but you always have to stay calm and carefully follow instructions if you want
  the compass to capture signals again. Modernity was a way to differentiate past and future, North and South, progress
  and regress, radical and conservative. However, at a time of deep ecological mutation, such a compass is running in
  wild circles without offering much bearing anymore. This is why it is time for a reset.
link: https://medialab.sciencespo.fr/en/productions/2016-04-reset-modernity/
